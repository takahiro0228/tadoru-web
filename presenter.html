<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>発表者ビュー – TADORU.</title>
    <style>
        :root{color-scheme:dark;font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#eee;background:#161616}
        *{box-sizing:border-box}
        html,body{height:100%;margin:0}
        body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#161616}
        header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #2a2a2a;font-size:12px;color:#aaa}
        header strong{color:#fff;font-size:13px}
        .clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:#fff}
        main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;min-height:0;padding:14px 16px}
        .pane{display:flex;flex-direction:column;min-height:0;gap:8px}
        .pane h2{margin:0;color:#8a8a8a;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
        .current-title{margin:0;color:#fff;font-size:18px;font-weight:700;line-height:1.35}
        .slide{flex:1 1 auto;min-height:0;display:grid;place-items:center;border:1px solid #2a2a2a;background:#000}
        .slide img{max-width:100%;max-height:100%;object-fit:contain}
        .slide .none{color:#666;font-size:12px}
        .notes{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px;border:1px solid #2a2a2a;background:#1f1f1f;color:#f3f3f3;font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
        .notes.empty{color:#666;font-size:13px}
        .next{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border:1px solid #2a2a2a;background:#1b1b1b}
        .next img{width:120px;border:1px solid #333;background:#000}
        .next .none{width:120px;height:68px;display:grid;place-items:center;border:1px solid #333;color:#666;font-size:10px}
        .next strong{display:block;color:#ddd;font-size:12px;line-height:1.4}
        .next span{display:block;margin-top:4px;color:#999;font-size:11px;line-height:1.5;white-space:pre-wrap;max-height:60px;overflow:hidden}
        footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid #2a2a2a}
        footer .buttons{display:flex;gap:8px}
        footer button{padding:9px 16px;border:1px solid #444;border-radius:999px;color:#fff;font:inherit;font-size:12px;font-weight:700;background:#222;cursor:pointer}
        footer button:hover{border-color:#fff}
        footer button.end{border-color:#7a2a24;color:#ff8a80}
        .counter{font-variant-numeric:tabular-nums;color:#aaa;font-size:12px}
        .status{color:#888;font-size:11px}
        @media(max-width:720px){main{grid-template-columns:1fr}}
    </style>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon128.png">
    <link rel="stylesheet" href="web.css">
</head>
<body>
    <header>
        <div><strong id="guideTitle">発表者ビュー</strong><span class="status" id="status">　スライドショーの開始を待っています</span></div>
        <div class="clock" id="clock">00:00</div>
    </header>
    <main>
        <section class="pane">
            <h2>いまの手順</h2>
            <p class="current-title" id="currentTitle">—</p>
            <div class="slide" id="currentSlide"><span class="none">画像なし</span></div>
        </section>
        <section class="pane">
            <h2>発表者ノート（話すこと）</h2>
            <div class="notes empty" id="notes">この手順に発表者ノートはありません。編集画面の「発表者ノート」に入力すると、ここに出ます。</div>
            <h2>次の手順</h2>
            <div class="next" id="next"><div class="none">—</div><div><strong id="nextTitle">—</strong><span id="nextNotes"></span></div></div>
        </section>
    </main>
    <footer>
        <span class="counter" id="counter">— / —</span>
        <div class="buttons">
            <button type="button" data-nav="prev">‹ 前へ</button>
            <button type="button" data-nav="next">次へ ›</button>
            <button type="button" class="end" data-nav="end">終了</button>
        </div>
    </footer>
    <script src="web-shim.js"></script>
    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="presenter.js"></script>
</body>
</html>
